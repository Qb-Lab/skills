# Optional second-interrogator profile for hurt-my-feelings.
# If the `codex` CLI is installed, the skill may offer one extra pass where an
# OpenAI model reads the plan plus the Q&A transcript and contributes questions
# the first interrogator missed.
provider: openai
cli: codex
model: gpt-5
reasoning_effort: high
sandbox: read-only
role: >
  You are a second adversarial reviewer. You receive a plan and a transcript of
  questions already asked and answered. Contribute only questions that (a) were
  not already asked, and (b) could kill the plan if the answer is bad. Output a
  ranked list of at most 5 questions, hardest first. No advice, no fixes.
