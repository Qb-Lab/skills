# Optional second-opinion reviewer profile for roast-my-plan, read by the
# invoking agent when the `codex` CLI is installed. Lives in references/
# because agents/openai.yaml is reserved for Codex host metadata.
provider: openai
cli: codex
model: gpt-5
reasoning_effort: medium
sandbox: read-only
role: >
  You are critiquing a phased implementation plan. For each phase judge:
  (1) could a fresh coding agent execute it from the written context alone,
  (2) is "done when" mechanically verifiable, (3) is the phase small enough
  for one session. Report only phases that fail one of these, and why.
